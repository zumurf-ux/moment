<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>잠시</title>
  <link rel="stylesheet" href="./styles.css?v=27">
</head>
<body class="reader-body">
  <main class="user-preview">
    <header class="reader-brand" aria-label="잠시">
      <img src="./app-icon.png?v=4" alt="" width="68" height="68">
      <div class="reader-brand-copy">
        <span>잠시</span>
        <small>하루 한 번, 세상을 보는 잠시</small>
      </div>
    </header>
    <p id="editionDateLine" class="eyebrow">잠시 · 일간</p>
    <h1 id="userHeadline">잠시</h1>
    <section class="market-board" aria-labelledby="marketTitle">
      <div class="market-heading">
        <div>
          <span class="market-kicker">주식 · 시장지수</span>
          <strong id="marketTitle">주요 지수 종가</strong>
        </div>
      </div>
      <div id="marketGrid" class="market-grid" aria-live="polite"></div>
      <p id="marketNote" class="market-note">종가 기준일 확인 중</p>
    </section>
    <div id="userIssues"></div>
    <footer class="reader-footer">© 2026 디자인하는삼촌 / 버전 1.0.00</footer>
  </main>
  <script type="module">
    import { firebaseConfig } from './firebase-config.js?v=13';
    import { demoData } from './demo-data.js?v=13';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { collection, doc, getDoc, getDocs, getFirestore, query, where } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const visibleTime = edition => {
      if (!edition.visibleAt) return new Date(`${edition.publishDate}T05:00:00+09:00`).getTime();
      if (typeof edition.visibleAt?.toDate === 'function') return edition.visibleAt.toDate().getTime();
      return new Date(edition.visibleAt).getTime();
    };
    const selectVisibleEdition = editions => editions
      .filter(edition => edition.status === 'PUBLISHED' && visibleTime(edition) <= Date.now())
      .sort((a,b) => String(b.publishDate).localeCompare(String(a.publishDate)) || Number(b.version||0)-Number(a.version||0))[0];

    const numberFormat = new Intl.NumberFormat('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const marketDirection = value => Number(value) > 0 ? 'up' : Number(value) < 0 ? 'down' : 'flat';
    const signed = value => `${Number(value) > 0 ? '+' : ''}${numberFormat.format(Number(value || 0))}`;
    const marketTime = value => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '갱신 시각 확인 중';
      return `${new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).format(date)} 기준`;
    };

    function renderMarkets(snapshot) {
      const quotes = Array.isArray(snapshot?.quotes) ? snapshot.quotes : [];
      if (!quotes.length) return;
      document.querySelector('#marketGrid').innerHTML = quotes.map(quote => {
        const direction = marketDirection(quote.change);
        return `<article class="market-card">
          <span>${escapeHtml(quote.name)}</span>
          <strong>${numberFormat.format(Number(quote.value))}</strong>
          <em class="${direction}">${signed(quote.change)} · ${signed(quote.changePercent)}%</em>
        </article>`;
      }).join('');
      const basisDate = String(snapshot.basisDate || '').replaceAll('-', '.');
      document.querySelector('#marketNote').textContent = `${basisDate || marketTime(snapshot.updatedAt).slice(0, 5)} 종가 기준`;
    }

    function render(edition) {
      document.querySelector('#userHeadline').textContent = edition.headline;
      document.querySelector('#editionDateLine').textContent = `${edition.publishDate.replaceAll('-', '.')} · 매일 오전 5시 발행`;
      document.querySelector('#userIssues').innerHTML = edition.items.map((item, index) => `
        <article>
          <span class="eyebrow">${String(index + 1).padStart(2, '0')} · ${escapeHtml(item.category)}</span>
          <h2>${escapeHtml(item.title)}</h2>
        </article>
      `).join('');
    }

    async function load() {
      let editions = demoData.editions;
      try {
        const db = getFirestore(initializeApp(firebaseConfig));
        const [editionSnapshot, marketSnapshot] = await Promise.all([
          getDocs(query(collection(db,'editions'),where('type','==','daily'),where('status','==','PUBLISHED'))),
          getDoc(doc(db, 'appConfig', 'markets')),
        ]);
        editions = editionSnapshot.docs.map(doc => ({id:doc.id,...doc.data()}));
        if (marketSnapshot.exists()) renderMarkets(marketSnapshot.data());
      } catch (error) {
        console.warn('Firebase 발행본을 불러오지 못해 저장본을 표시합니다.');
      }
      const edition = selectVisibleEdition(editions) || selectVisibleEdition(demoData.editions);
      if (edition) render(edition);
      const nextVisibleAt = editions.map(visibleTime).filter(time => time > Date.now()).sort((a,b)=>a-b)[0];
      if (nextVisibleAt) setTimeout(() => location.reload(), Math.min(nextVisibleAt-Date.now()+500, 2147483647));
    }
    load();
  </script>
</body>
</html>
